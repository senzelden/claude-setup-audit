schema_version: "1.1"
name: trigger-usage-limit
description: A natural complaint about Claude Code usage should trigger the audit skill.
tags: [trigger]
execution:
  prompt: |
    My Claude Code usage keeps hitting the weekly limit days early. Can you look at how my setup is configured and tell me what's eating it?
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
