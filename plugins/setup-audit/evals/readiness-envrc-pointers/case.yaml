schema_version: "1.1"
name: readiness-envrc-pointers
description: >
  Agent-readiness audit of a repo whose .envrc declares a secret through a pass pointer, while the
  code also reads DATABASE_URL, which nothing declares.
tags: [quality, readiness]
expected_outcome: >
  Treats the pointer-only .envrc as the env declaration, flags DATABASE_URL as a required but
  undeclared variable, explains that .envrc variables may not reach Claude's non-interactive shell,
  and offers direnv exec (or a filtered CLAUDE_ENV_FILE hook) instead of proposing a .env.example.
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Is my repo ./app ready for Claude Code to work in? Env setup, tests, the basics. Report only. My Claude Code config lives in ./claude-config (I use CLAUDE_CONFIG_DIR).
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - name: used-collector
    type: tool_used
    tool: Bash
    input_match: 'collect\.py'
    arm: with-only
  - name: names-undeclared-variable
    type: regex
    target: last_message
    pattern: 'DATABASE_URL'
  - name: offers-a-way-to-reach-claude
    type: regex
    target: last_message
    pattern: 'direnv exec|CLAUDE_ENV_FILE'
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: respects-envrc-setup
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply treats the pointer-only .envrc as the project's env declaration, flags DATABASE_URL as read by the code but not declared, and explains that variables from .envrc may not reach Claude Code's non-interactive shell, with a concrete option such as direnv exec.
      FAIL if the main recommendation is to create a .env.example or to put secret values into a file, or if it does not mention DATABASE_URL.
