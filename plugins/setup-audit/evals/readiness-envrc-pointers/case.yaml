schema_version: "1.1"
name: readiness-envrc-pointers
description: >
  Agent-readiness audit of a repo whose .envrc declares a secret through a pass pointer, while the
  code also reads DATABASE_URL, which nothing declares.
tags: [quality, readiness]
expected_outcome: >
  Treats the pointer-only .envrc as the env declaration, flags DATABASE_URL as a required but
  undeclared variable, explains that .envrc variables may not reach Claude's non-interactive shell,
  and offers direnv exec (or a filtered CLAUDE_ENV_FILE hook) instead of proposing a .env.example.
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Is my repo ./app ready for Claude Code to work in? Env setup, tests, the basics. Report only. My Claude Code config lives in ./claude-config (I use CLAUDE_CONFIG_DIR).
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
  # The collector's success line, not just an attempt: a denied or failing call must not pass.
  - name: collector-ran
    type: regex
    target: trace
    pattern: 'wrote [^ ]+ \(\d+ est\. tokens\)'
    arm: with-only
  - name: names-undeclared-variable
    type: regex
    target: last_message
    pattern: 'DATABASE_URL'
  - name: offers-a-way-to-reach-claude
    type: regex
    target: last_message
    pattern: 'direnv exec|CLAUDE_ENV_FILE'
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: respects-envrc-setup
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply treats the pointer-only .envrc as the project's env declaration (for example proposing to declare DATABASE_URL in .envrc), flags DATABASE_URL as read by the code but not declared, and explains that variables from .envrc may not reach Claude Code's non-interactive shell, with a concrete option such as direnv exec. Mentioning .env.example as a secondary alternative is fine.
      FAIL if its primary fix replaces the .envrc pointer setup with a .env.example, if it tells the user to write secret values into a file, or if it does not mention DATABASE_URL.
