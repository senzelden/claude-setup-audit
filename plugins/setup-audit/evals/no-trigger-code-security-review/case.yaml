schema_version: "1.1"
name: no-trigger-code-security-review
description: Near miss. A security review of application code is not a Claude Code setup audit.
tags: [trigger]
execution:
  prompt: |
    Review this Python function for security bugs:

    ```python
    def load_config(path):
        return eval(open(path).read())
    ```
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
    min: 0
    max: 0
    arm: both
  - name: answered-the-question
    type: regex
    target: last_message
    pattern: 'eval'
    flags: i
