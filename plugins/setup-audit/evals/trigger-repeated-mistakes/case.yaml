schema_version: "1.1"
name: trigger-repeated-mistakes
description: Recurring corrections across repos should trigger the audit skill's learning track.
tags: [trigger]
execution:
  prompt: |
    Claude keeps making the same mistakes in all my repos even though I correct it every time. What in my Claude Code setup should change so that stops?
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
