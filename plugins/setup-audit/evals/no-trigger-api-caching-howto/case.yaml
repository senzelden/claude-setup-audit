schema_version: "1.1"
name: no-trigger-api-caching-howto
description: Near miss. How to use prompt caching in API code is a how-to, not an audit of the user's setup, even though the plugin also checks caching.
tags: [trigger]
execution:
  prompt: |
    How do I add prompt caching to my Anthropic API calls in Python? A short example is enough.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
    min: 0
    max: 0
    arm: both
  - name: answered-the-question
    type: regex
    target: last_message
    pattern: 'cache_control'
