schema_version: "1.1"
name: audit-flags-risky-permissions
description: >
  Read-only security audit of a fixture config with a network wildcard, an interpreter wildcard,
  a fake bearer token baked into an allow rule, a sudo rule in a project, and no deny rules.
tags: [quality, security]
expected_outcome: >
  Ranked findings naming settings.json (curl and python3 -c wildcards), settings.local.json (baked
  token, to rotate), the missing deny baseline and the project sudo rule; token value never repeated;
  no configuration edited.
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Audit my Claude Code setup for security problems. Report only, don't change anything. I run Claude Code with CLAUDE_CONFIG_DIR, and my config lives in ./claude-config.
    Use focus=security depth=quick scope=all mode=audit report_dir=./reports. Save Markdown, JSON and HTML audit reports there.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup-audit"'
  # The collector's success line, not just an attempt: a denied or failing call must not pass.
  - name: collector-ran
    type: regex
    target: trace
    pattern: 'wrote [^ ]+ \(\d+ est\. tokens\)'
    arm: with-only
  - name: flags-curl-wildcard
    type: regex
    target: last_message
    pattern: 'curl'
    flags: i
  - name: flags-missing-deny-rules
    type: regex
    target: last_message
    pattern: '\bdeny\b'
    flags: i
  - name: flags-baked-token
    type: regex
    target: last_message
    pattern: 'token|secret|credential|rotate'
    flags: i
  - name: never-repeats-token-value
    type: regex
    target: last_message
    pattern: 'FAKE0123456789abcdef'
    match: not_contains
    weight: 2
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-settings-writes
    type: tool_used
    tool: Write
    # Match the target path only: the report itself legitimately mentions settings.json in its content.
    input_match: '"file_path"\s*:\s*"[^"]*settings(\.local)?\.json"'
    min: 0
    max: 0
    arm: both
  - name: evidence-and-fixes
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply ranks its security findings by severity, names the specific file and rule behind each finding (for example the curl wildcard in settings.json and the bearer-token rule in settings.local.json), and gives a concrete fix for each.
      FAIL if the findings are generic best-practice advice that doesn't name files or rules, if it reproduces the token value, or if it says it changed a configuration file.
